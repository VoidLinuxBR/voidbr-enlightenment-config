-- Conky VoidBR: relógio + resumo do sistema com as cores da paleta VoidBR (Tokyo Night)
-- Iniciar manualmente: conky -d   (ou adicionar em Configurações > Aplicativos > Inicialização)

conky.config = {
    background = true,
    update_interval = 1,
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 60,
    minimum_width = 260,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    use_xft = true,
    font = 'Noto Sans:size=10',
    default_color = 'A9B1D6',   -- :fg
    color1 = '7AA2F7',          -- azul (Tokyo Night)
    color2 = 'E0AF68',          -- :selected-alt (amarelo)
    color3 = '9ECE6A',          -- :selected (verde)
    color4 = '737AA2',          -- :fg-dim
}

conky.text = [[
${alignr}${color1}${font Noto Sans:light:size=48}${time %H:%M}${font}
${alignr}${color4}${time %A, %d de %B}
${voffset 8}${color2}SISTEMA ${color4}${hr 1}
${color}Kernel ${alignr}${kernel}
${color}Uptime ${alignr}${uptime_short}
${color}CPU ${alignr}${cpu cpu0}%
${color3}${cpubar cpu0 4}
${color}RAM ${alignr}${mem} / ${memmax}
${color3}${membar 4}
${color}Disco / ${alignr}${fs_used /} / ${fs_size /}
${color3}${fs_bar 4 /}
]]
