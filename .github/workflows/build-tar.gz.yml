name: Criar release e arquivo .tar.gz

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "With TMATE"
        required: false
        default: false

  repository_dispatch:
    types:
      - webhook
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir nome e tag
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
          echo "TAG=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: Criar arquivo .tar.gz
        run: |
          tar --exclude=.git --exclude=.github -czf "/tmp/${REPO_NAME}.tar.gz" .
          mv "/tmp/${REPO_NAME}.tar.gz" .

      - name: Salvar arquivo .tar.gz como artefato
        uses: actions/upload-artifact@v4
        with:
          name: arquivos
          path: ${{ env.REPO_NAME }}.tar.gz

      - name: Criar release com o .tar.gz
        run: |
          gh release create "${TAG}" "${REPO_NAME}.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Release ${TAG}" \
            --notes "- **Data e Hora:** ${TAG}
          - **Repositório:** ${REPO_NAME}
          - **Commit:** ${GITHUB_SHA::7}"

      - name: Sessão de depuração (tmate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: mxschmitt/action-tmate@v3
